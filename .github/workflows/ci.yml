name: SAGE checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt
      - name: Install API test dependencies
        run: python -m pip install -r backend/requirements-ci.txt
      - name: Run isolated backend acceptance checks
        working-directory: backend
        env:
          APP_ENV: test
          LLM_DEBUG: '0'
          RAG_BACKEND: keyword
        run: python -m unittest discover -s tests -t . -v
      - name: Retrieval relevance smoke gate
        working-directory: backend
        env:
          RAG_BACKEND: keyword
        run: python -m app.scripts.benchmark_rag --min-hit-at-k 1.0

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Production build
        working-directory: frontend
        run: npm run build
